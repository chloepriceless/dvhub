# DVhub Vorab-Image → Docker Hub + GitHub Container Registry, Tag „dev"
#
#   docker.io/bikinibottomcapital/dvhub:dev      ghcr.io/chloepriceless/dvhub:dev
#
# Läuft nach jedem Push auf main, sobald die CI (ci.yml) dafür GRÜN ist — ein
# roter Stand wird nie veröffentlicht. „dev" ist der aktuelle main, kein Release;
# Releases (:X.Y.Z, :X.Y, :latest) baut weiterhin nur container.yml beim Tag.
#
# EOS: das dev-Image braucht den EOS-Stand aus docker/.env.example (EOS_TAG,
# EOS_IMAGE_TAG). scripts/eos-image-plan.sh entscheidet: Zeigt der Pin auf ein
# offizielles Image (akkudoktor/eos), wird nichts gebaut. Sonst (DVhub-EOS aus
# dem Fork, oder ein Vorab-Stand) wird unser dvhub-eos:<EOS_IMAGE_TAG> aus
# repo#EOS_TAG nachgebaut (amd64 + arm64), FALLS es auf Docker Hub fehlt
# (:latest bleibt dem Release vorbehalten).
#
# Docker-Hub-Token: Repo-Secret BIKINIBOTTOMCAPITAL (oder DOCKERHUB_TOKEN), wie
# in container.yml.
#
# SECURITY: ausgelöst über workflow_run, also mit Repo-Secrets — deshalb nur für
# Push-Läufe auf main (nie für Pull Requests aus Forks) und mit dem Commit, den
# die CI geprüft hat.

name: Container (dev)

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: container-dev
  cancel-in-progress: true

jobs:
  publish:
    name: publish dev (amd64 + arm64)
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Docker-Hub-Token vorhanden
        env:
          HUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN || secrets.BIKINIBOTTOMCAPITAL }}
        run: |
          test -n "$HUB_TOKEN" || { echo "::error::Docker-Hub-Token fehlt (Secret BIKINIBOTTOMCAPITAL oder DOCKERHUB_TOKEN)"; exit 1; }

      - name: Version aus package.json
        id: v
        run: echo "version=$(node -p 'require("./dvhub/package.json").version')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v4
        with:
          username: bikinibottomcapital
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.BIKINIBOTTOMCAPITAL }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            docker.io/bikinibottomcapital/dvhub:dev
            ghcr.io/${{ github.repository_owner }}/dvhub:dev
          build-args: |
            VCS_REF=${{ github.event.workflow_run.head_sha }}
            APP_VERSION=${{ steps.v.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-eos:
    name: EOS-Image (nur ohne offizielles, und nur falls es fehlt)
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: EOS-Image zum Pin (offiziell, vorhanden oder bauen)
        id: eos
        run: scripts/eos-image-plan.sh

      - uses: docker/setup-qemu-action@v4
        if: steps.eos.outputs.build == 'true'
      - uses: docker/setup-buildx-action@v4
        if: steps.eos.outputs.build == 'true'

      - uses: docker/login-action@v4
        if: steps.eos.outputs.build == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v4
        if: steps.eos.outputs.build == 'true'
        with:
          username: bikinibottomcapital
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.BIKINIBOTTOMCAPITAL }}

      # DVhub-EOS immer mit Rust-Kern (T-0415, Christin 11.11.2026). Die Wheels
      # sind Release-Assets des Fork-Tags; eos-version.env pinnt Datei + sha256.
      # Ein Pin, dessen Wheels nicht zu genau diesem Git-Tag gehören, bricht ab.
      # Ablage im Checkout (.eos-wheels): Bake liest benannte Kontexte außerhalb
      # des Arbeitsordners nur mit Freigabe (fs-Entitlement, Codex c0af4b31).
      - name: Rust-Kern-Wheels zum Pin holen und prüfen
        if: steps.eos.outputs.build == 'true'
        env:
          EOS_TAG: ${{ steps.eos.outputs.tag }}
          EOS_REPO: ${{ steps.eos.outputs.repo }}
        run: |
          set -euo pipefail
          url="$(grep -E '^EOS_NATIVE_URL=' eos-version.env | tail -n 1 | cut -d= -f2-)"
          want="${EOS_REPO%.git}/releases/download/${EOS_TAG}"
          test "$url" = "$want" || { echo "::error::EOS_NATIVE_URL=$url gehört nicht zum Pin ($want)"; exit 1; }
          scripts/eos-native-wheels.sh fetch .eos-wheels X86_64 AARCH64

      # Wie tools/dvhub-eos/build-image.sh im Fork: Stufe 1 das unveränderte
      # Root-Dockerfile am Git-Tag (BUILD_VERSION = Docker-Tag), Stufe 2
      # docker/eos-native (Wheel, EOS_OPTIMIZATION__GENETIC__BACKEND=native) mit
      # Bau-Stufe "smoke": für amd64 UND arm64 muss ein kurzer Lauf nativ und ohne
      # Python-Rückfall rechnen (scripts/eos-native-smoke.py), sonst ist der Job
      # rot und nichts wird veröffentlicht.
      - name: DVhub-EOS mit Rust-Kern bauen, Rauchtest, veröffentlichen
        if: steps.eos.outputs.build == 'true'
        env:
          EOS_REPO: ${{ steps.eos.outputs.repo }}
          EOS_TAG: ${{ steps.eos.outputs.tag }}
          EOS_IMAGE_TAG: ${{ steps.eos.outputs.image_tag }}
          WHEELS_DIR: .eos-wheels
          PLATFORMS: linux/amd64,linux/arm64
          TAGS: docker.io/bikinibottomcapital/dvhub-eos:${{ steps.eos.outputs.image_tag }},ghcr.io/${{ github.repository_owner }}/dvhub-eos:${{ steps.eos.outputs.image_tag }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2046
          export $(grep -E '^EOS_NATIVE_[A-Z0-9_]+=' eos-version.env)
          docker buildx bake -f docker/eos-native/docker-bake.hcl --push dvhub-eos

  # Schlanke Images für schwache Geräte (SPiNE EnergyLink, 2026-10-19):
  #   bikinibottomcapital/timescaledb-slim:<TIMESCALE_TAG>   (docker/timescaledb-slim)
  #   bikinibottomcapital/dvhub-eos-slim:<EOS_IMAGE_TAG>     (docker/eos-slim)
  # Gebaut wird nur, wenn das Image zum Pin fehlt oder sich sein Dockerfile in
  # diesem Commit geändert hat. Grundlage: das offizielle TimescaleDB-Image zum
  # Pin bzw. das EOS-Image zum Pin (deshalb nach publish-eos).
  publish-slim:
    name: schlanke Images (TimescaleDB, EOS)
    needs: publish-eos
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2

      - name: EOS-Image zum Pin
        id: eos
        run: scripts/eos-image-plan.sh

      - name: Was ist zu bauen?
        id: plan
        run: |
          set -euo pipefail
          val() { { grep -E "^$1=" docker/.env.example || true; } | tail -n 1 | cut -d= -f2-; }
          ts_tag="$(val TIMESCALE_TAG)"; ts_version="${ts_tag%%-pg*}"
          [ -n "$ts_tag" ] && [ "$ts_version" != "$ts_tag" ] || { echo "::error::TIMESCALE_TAG fehlt oder ohne -pgNN: '$ts_tag'"; exit 1; }
          changed="$(git diff --name-only HEAD~1 HEAD 2>/dev/null || true)"
          need() { # need IMAGE ORDNER
            if ! docker manifest inspect "$1" >/dev/null 2>&1; then echo true; return; fi
            if printf '%s\n' "$changed" | grep -q "^$2/"; then echo true; return; fi
            echo false
          }
          {
            echo "ts_tag=$ts_tag"; echo "ts_version=$ts_version"
            echo "ts_build=$(need "docker.io/bikinibottomcapital/timescaledb-slim:$ts_tag" docker/timescaledb-slim)"
            echo "eos_build=$(need "docker.io/bikinibottomcapital/dvhub-eos-slim:${{ steps.eos.outputs.image_tag }}" docker/eos-slim)"
          } | tee -a "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
        if: steps.plan.outputs.ts_build == 'true' || steps.plan.outputs.eos_build == 'true'
      - uses: docker/setup-buildx-action@v4
        if: steps.plan.outputs.ts_build == 'true' || steps.plan.outputs.eos_build == 'true'

      - uses: docker/login-action@v4
        if: steps.plan.outputs.ts_build == 'true' || steps.plan.outputs.eos_build == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v4
        if: steps.plan.outputs.ts_build == 'true' || steps.plan.outputs.eos_build == 'true'
        with:
          username: bikinibottomcapital
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.BIKINIBOTTOMCAPITAL }}

      - uses: docker/build-push-action@v7
        if: steps.plan.outputs.ts_build == 'true'
        with:
          context: docker/timescaledb-slim
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            docker.io/bikinibottomcapital/timescaledb-slim:${{ steps.plan.outputs.ts_tag }}
            ghcr.io/${{ github.repository_owner }}/timescaledb-slim:${{ steps.plan.outputs.ts_tag }}
          build-args: |
            TS_IMAGE=timescale/timescaledb:${{ steps.plan.outputs.ts_tag }}
            TS_VERSION=${{ steps.plan.outputs.ts_version }}

      - uses: docker/build-push-action@v7
        if: steps.plan.outputs.eos_build == 'true'
        with:
          context: docker/eos-slim
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            docker.io/bikinibottomcapital/dvhub-eos-slim:${{ steps.eos.outputs.image_tag }}
            ghcr.io/${{ github.repository_owner }}/dvhub-eos-slim:${{ steps.eos.outputs.image_tag }}
          build-args: |
            EOS_IMAGE=${{ steps.eos.outputs.image }}
            EOS_IMAGE_TAG=${{ steps.eos.outputs.image_tag }}
