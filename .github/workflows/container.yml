# DVhub Container-Images → Docker Hub (öffentlich) + GitHub Container Registry
#
#   docker.io/bikinibottomcapital/dvhub      ghcr.io/chloepriceless/dvhub
#   docker.io/bikinibottomcapital/dvhub-eos  ghcr.io/chloepriceless/dvhub-eos
#
# NUR bei einem Release: Tag vX.Y.Z pushen → :X.Y.Z, :X.Y, :latest.
# Pushes auf main bauen KEIN Image (dort laufen nur die Tests, ci.yml).
#
#   Release: Version in dvhub/package.json anheben, CHANGELOG, dann
#     git tag v1.0.7 && git push origin v1.0.7
#   Der Tag muss zur package.json-Version passen, sonst bricht der Lauf ab.
#
# EOS: scripts/eos-image-plan.sh entscheidet anhand von docker/.env.example.
# Seit 1.0.10 das DVhub-EOS: dvhub-eos wird aus dem unveränderten Dockerfile
# des Forks chloepriceless/EOS am Git-Tag EOS_TAG (dvhub-eos-<version>-dvhub.N)
# für amd64 + arm64 gebaut und unter EOS_IMAGE_TAG (<version>-dvhub.N)
# veröffentlicht, plus :latest. Der Git-Tag muss dafür im Fork liegen.
# Zeigt der Pin auf ein offizielles Image (akkudoktor/eos), wird nichts gebaut;
# gibt es zu einem Akkudoktor-Pin ein offizielles Image, das noch nicht
# eingetragen ist, bricht das Release ab.
#
# Docker Hub: Benutzer bikinibottomcapital (kein Geheimnis, steht hier fest).
# Token als Repo-Secret (Settings → Secrets and variables → Actions), Name
# BIKINIBOTTOMCAPITAL (oder DOCKERHUB_TOKEN), Wert = Docker-Hub-Access-Token
# (Read & Write). Fehlt es, bricht der Release-Lauf ab (kein halbes Release).
# GHCR braucht nichts weiter (GITHUB_TOKEN, packages: write).
#
# Ablauf: erst ein amd64-Image bauen und mit docker/compose.yml (TimescaleDB)
# durchstarten — Healthcheck, Migrationen, DB-Backup-Download und Update-Sperre
# prüfen. Nur wenn das grün ist, wird für amd64 + arm64 gebaut und gepusht.
#
# SECURITY: nur GITHUB_TOKEN (packages: write fürs Pushen). Die DB-Passwörter
# des Smoke-Tests sind Wegwerfwerte der ephemeren Runner-Instanz.

name: Container

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Volle Testsuite (ci.yml) für genau diesen Tag-Commit — vorher prüfte der
  # Release nur seinen eigenen Smoke-Test (Codex-Review Q2, 2026-10-18).
  tests:
    name: volle Tests (ci.yml)
    uses: ./.github/workflows/ci.yml

  smoke:
    name: smoke (amd64 + TimescaleDB)
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Release-Tag passt zur package.json-Version
        run: |
          want="v$(node -p 'require("./dvhub/package.json").version')"
          echo "Tag ${GITHUB_REF_NAME}, package.json ${want}"
          test "${GITHUB_REF_NAME}" = "${want}" || { echo "::error::Tag ${GITHUB_REF_NAME} passt nicht zu dvhub/package.json (${want})"; exit 1; }

      - name: Docker-Hub-Token vorhanden
        env:
          HUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN || secrets.BIKINIBOTTOMCAPITAL }}
        run: |
          test -n "$HUB_TOKEN" || { echo "::error::Docker-Hub-Token fehlt (Secret BIKINIBOTTOMCAPITAL oder DOCKERHUB_TOKEN)"; exit 1; }

      # Vor jedem Veröffentlichen: passt das EOS-Image zum Pin?
      - name: EOS-Image zum Pin
        run: scripts/eos-image-plan.sh --release

      - name: Compose-Umgebung
        run: |
          {
            echo "DB_ADMIN_PASSWORD=$(openssl rand -hex 16)"
            echo "DVHUB_DB_PASSWORD=$(openssl rand -hex 16)"
            echo "DVHUB_TAG=ci"
          } > docker/.env

      - name: Bauen und starten
        run: docker compose -f docker/compose.yml --env-file docker/.env up -d --build

      - name: Warten bis healthy
        run: |
          for i in $(seq 1 60); do
            s=$(docker inspect --format '{{.State.Health.Status}}' dvhub-dvhub-1 2>/dev/null || true)
            echo "dvhub: $s"
            [ "$s" = healthy ] && exit 0
            sleep 5
          done
          docker compose -f docker/compose.yml --env-file docker/.env logs --tail=200
          exit 1

      - name: Prüfen
        run: |
          set -e
          B=http://127.0.0.1:8080
          curl -fsS $B/api/status > /dev/null
          # Migrationen gegen TimescaleDB gelaufen, Telemetrie verbunden
          curl -fsS $B/health | tee /tmp/health.json
          node -e 'const h=require("/tmp/health.json");if(!h.telemetry||h.telemetry.ok!==true){console.error("Telemetrie nicht bereit");process.exit(1)}'
          # DB-Backup-Download aus der Oberfläche (pg_dump im Image, als DB-Admin)
          curl -fsS "$B/api/db/backup?scope=energy15m" -o /tmp/b.dump
          head -c 5 /tmp/b.dump | grep -q PGDMP
          # Update/Reboot antworten im Container mit Hinweis statt git/apt
          code=$(curl -s -o /tmp/u.json -w '%{http_code}' $B/api/admin/update/check)
          test "$code" = 409 && grep -q container_runtime /tmp/u.json
          # die Anwendung (PID 1 nach su-exec) läuft nicht als root — `docker exec
          # id -u` wäre die UID der exec-Shell (root), nicht die der App
          uid=$(docker exec dvhub-dvhub-1 awk '/^Uid:/{print $2}' /proc/1/status)
          echo "PID 1 uid=$uid"; test -n "$uid" && test "$uid" != 0
          # … behält aber CAP_NET_BIND_SERVICE (Bit 10) für Modbus 502 aus der Oberfläche
          amb=$(docker exec dvhub-dvhub-1 awk '/^CapAmb:/{print $2}' /proc/1/status)
          echo "PID 1 CapAmb=$amb"; test $(( 0x$amb & 0x400 )) -ne 0

      - name: Logs bei Fehler
        if: failure()
        run: docker compose -f docker/compose.yml --env-file docker/.env logs --tail=300

  publish:
    name: publish (amd64 + arm64)
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Version aus package.json
        id: v
        run: echo "version=$(node -p 'require("./dvhub/package.json").version')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v4
        with:
          username: bikinibottomcapital
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.BIKINIBOTTOMCAPITAL }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            docker.io/bikinibottomcapital/dvhub
            ghcr.io/${{ github.repository_owner }}/dvhub
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VCS_REF=${{ github.sha }}
            APP_VERSION=${{ steps.v.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-eos:
    name: publish EOS (nur ohne offizielles Image)
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: EOS-Image zum Pin (offiziell oder bauen)
        id: eos
        run: scripts/eos-image-plan.sh --release

      - uses: docker/setup-qemu-action@v4
        if: steps.eos.outputs.build == 'true'
      - uses: docker/setup-buildx-action@v4
        if: steps.eos.outputs.build == 'true'

      - uses: docker/login-action@v4
        if: steps.eos.outputs.build == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v4
        if: steps.eos.outputs.build == 'true'
        with:
          username: bikinibottomcapital
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.BIKINIBOTTOMCAPITAL }}

      # DVhub-EOS immer mit Rust-Kern (T-0415, Christin 11.11.2026). Die Wheels
      # sind Release-Assets des Fork-Tags; eos-version.env pinnt Datei + sha256.
      # Ein Pin, dessen Wheels nicht zu genau diesem Git-Tag gehören, bricht ab.
      - name: Rust-Kern-Wheels zum Pin holen und prüfen
        if: steps.eos.outputs.build == 'true'
        env:
          EOS_TAG: ${{ steps.eos.outputs.tag }}
          EOS_REPO: ${{ steps.eos.outputs.repo }}
        run: |
          set -euo pipefail
          url="$(grep -E '^EOS_NATIVE_URL=' eos-version.env | tail -n 1 | cut -d= -f2-)"
          want="${EOS_REPO%.git}/releases/download/${EOS_TAG}"
          test "$url" = "$want" || { echo "::error::EOS_NATIVE_URL=$url gehört nicht zum Pin ($want)"; exit 1; }
          scripts/eos-native-wheels.sh fetch "$RUNNER_TEMP/eos-wheels" X86_64 AARCH64

      # Wie tools/dvhub-eos/build-image.sh im Fork: Stufe 1 das unveränderte
      # Root-Dockerfile am Git-Tag (BUILD_VERSION = Docker-Tag), Stufe 2
      # docker/eos-native (Wheel, EOS_OPTIMIZATION__GENETIC__BACKEND=native) mit
      # Bau-Stufe "smoke": für amd64 UND arm64 muss ein kurzer Lauf nativ und ohne
      # Python-Rückfall rechnen (scripts/eos-native-smoke.py), sonst ist der Job
      # rot und nichts wird veröffentlicht.
      - name: DVhub-EOS mit Rust-Kern bauen, Rauchtest, veröffentlichen
        if: steps.eos.outputs.build == 'true'
        env:
          EOS_REPO: ${{ steps.eos.outputs.repo }}
          EOS_TAG: ${{ steps.eos.outputs.tag }}
          EOS_IMAGE_TAG: ${{ steps.eos.outputs.image_tag }}
          WHEELS_DIR: ${{ runner.temp }}/eos-wheels
          PLATFORMS: linux/amd64,linux/arm64
          TAGS: docker.io/bikinibottomcapital/dvhub-eos:${{ steps.eos.outputs.image_tag }},docker.io/bikinibottomcapital/dvhub-eos:latest,ghcr.io/${{ github.repository_owner }}/dvhub-eos:${{ steps.eos.outputs.image_tag }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2046
          export $(grep -E '^EOS_NATIVE_[A-Z0-9_]+=' eos-version.env)
          docker buildx bake -f docker/eos-native/docker-bake.hcl --push dvhub-eos
