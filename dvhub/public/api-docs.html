<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DVhub API Dokumentation</title>
  <!-- Plan 08-05 Task 2: Swagger UI pinned to 5.11.0 with sha384 SRI so a
       compromised unpkg CDN cannot inject attacker-controlled JS/CSS. Bump
       version + SRI together (regenerate via `curl -sL … | openssl dgst -sha384 -binary | openssl base64 -A`). -->
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui.css"
        integrity="sha384-+yyzNgM3K92sROwsXxYCxaiLWxWJ0G+v/9A+qIZ2rgefKgkdcmJI+L601cqPD/Ut"
        crossorigin="anonymous">
  <style>
    body { margin: 0; background: #fafafa; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .topbar { display: none !important; }
    .swagger-ui .info { margin: 20px 0 16px; }
    .swagger-ui .info .title { font-size: 1.8em; }
    .back-link { display: block; padding: 12px 24px; background: #1d1d1f; color: #a1a1a6; font-size: 0.85em; text-decoration: none; }
    .back-link:hover { color: #fff; }
    .back-link span { color: #0088e8; margin-right: 8px; }
  </style>
</head>
<body>
  <a href="/" class="back-link"><span>&larr;</span> Zurück zum Dashboard</a>
  <div id="swagger-ui"></div>
  <script src="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui-bundle.js"
          integrity="sha384-qn5tagrAjZi8cSmvZ+k3zk4+eDEEUcP9myuR2J6V+/H6rne++v6ChO7EeHAEzqxQ"
          crossorigin="anonymous"></script>
  <script src="/api-docs-init.js"></script>
</body>
</html>
