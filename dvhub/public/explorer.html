<!doctype html>
<!-- Explorer page — Aurora port (Plan 09.1-06 Wave 5).
     - Loads Aurora design tokens (dvhub-app.css) + theme.js + page-specific
       explorer.css (rules harvested from styles.css with --flow-* tokens
       remapped to Aurora). styles.css is NOT loaded.
     - theme.js is the SOLE writer of localStorage['dvhub.theme']
       (AURORA-02 single-writer); explorer.js MUST NOT call setItem on
       that key.
     - Binding contract: explorer.js binds against 12 IDs:
       explorerRange, customStartWrap, explorerStart, customEndWrap,
       explorerEnd, explorerAgg, explorerLoadBtn, explorerResetZoomBtn,
       explorerSeriesChips, explorerCanvas (Chart.js mount), explorerCsvBtn,
       explorerStatus.
     - Chart.js + chartjs-plugin-zoom + hammer.js loaded at /chart.min.js
       etc. — same canonical paths as Wave 3 history port. -->
<html lang="de" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DVhub Explorer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/dvhub-app.css" />
  <link rel="stylesheet" href="/explorer.css" />
  <script src="/theme.js"></script>
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png?v=20260508">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png?v=20260508">
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0B0F1A">
</head>
<body>
  <div class="app-shell">
    <header class="topbar" data-screen-label="Topbar">
      <div class="topbar-brand">
        <img src="/assets/dvhub-wordmark.png" alt="DVhub">
        <span class="product">Explorer</span>
      </div>
      <button class="nav-toggle" id="navToggle" type="button" aria-label="Hauptnavigation umschalten" aria-expanded="false" aria-controls="topbarNav">
        <span class="nav-toggle-bar"></span>
        <span class="nav-toggle-bar"></span>
        <span class="nav-toggle-bar"></span>
      </button>
      <nav class="topbar-nav" id="topbarNav" aria-label="Hauptnavigation">
        <a href="/">Leitstand</a>
        <a href="/family">Familie</a>
        <a href="/integrations">Integrationen</a>
        <a href="/history.html">Historie</a>
        <a class="is-active" href="/explorer.html">Explorer</a>
        <a href="/settings.html">Einstellungen</a>
      </nav>
      <div class="topbar-right">
        <button class="theme-toggle" type="button" aria-label="Theme umschalten">
          <span class="theme-label">Theme</span>
        </button>
      </div>
    </header>

    <main class="page-content">
      <div class="page-header-card">
        <div class="page-header-card-copy">
          <p class="page-kicker">Explorer</p>
          <h1>Daten-Explorer</h1>
          <p class="page-subtitle">Alle Messwerte frei kombinierbar mit Zoom, Pan und CSV-Export.</p>
        </div>
      </div>

      <div class="sub-card">
        <div class="explorer-controls">
          <div class="explorer-control">
            <label for="explorerRange">Zeitbereich</label>
            <select id="explorerRange">
              <option value="today">Heute</option>
              <option value="yesterday">Gestern</option>
              <option value="7d" selected>Letzte 7 Tage</option>
              <option value="30d">Letzte 30 Tage</option>
              <option value="custom">Benutzerdefiniert</option>
            </select>
          </div>
          <div class="explorer-control u-hidden" id="customStartWrap">
            <label for="explorerStart">Von</label>
            <input type="date" id="explorerStart" />
          </div>
          <div class="explorer-control u-hidden" id="customEndWrap">
            <label for="explorerEnd">Bis</label>
            <input type="date" id="explorerEnd" />
          </div>
          <div class="explorer-control">
            <label for="explorerAgg">Aggregation</label>
            <select id="explorerAgg">
              <option value="15min" selected>15 Minuten</option>
              <option value="1h">1 Stunde</option>
              <option value="day">Tag</option>
            </select>
          </div>
          <div class="explorer-control">
            <button class="btn primary" id="explorerLoadBtn" type="button">Laden</button>
          </div>
          <div class="explorer-control">
            <button class="btn ghost" id="explorerResetZoomBtn" type="button">Zoom Reset</button>
          </div>
        </div>

        <div id="explorerSeriesChips" class="explorer-series-grid"></div>

        <div class="explorer-chart-wrap">
          <canvas id="explorerCanvas"></canvas>
        </div>

        <div class="explorer-actions">
          <button class="btn ghost" id="explorerCsvBtn" type="button">CSV Export</button>
          <span class="explorer-status" id="explorerStatus">Bereit.</span>
        </div>
      </div>
    </main>
  </div>

  <script src="/chart.min.js"></script>
  <script src="/hammer.min.js"></script>
  <script src="/chartjs-plugin-zoom.min.js"></script>
  <script src="/common.js"></script>
  <script src="/dv-modal.js"></script>
  <script src="/explorer.js"></script>
</body>
</html>
