# DVhub + TimescaleDB — Docker Compose
#
#   cp docker/.env.example docker/.env      # Passwörter setzen!
#   docker compose -f docker/compose.yml --env-file docker/.env up -d
#
# Danach: http://<host>:8080  (Port über DVHUB_HTTP_PORT, nur beim ersten Start)
#
# Aufbau wie die native Installation:
#   * Rolle `postgres` = DB-Admin (nur für Backup/Restore aus der Oberfläche),
#     Rolle `dvhub`    = die App, KEIN Superuser, Eigentümer der DB `dvhub`.
#     Die Trennung ist nötig: der Restore sperrt die App per CONNECTION LIMIT 0
#     aus — das wirkt nur auf Nicht-Superuser.
#   * TimescaleDB-Version wie auf den Appliances (PostgreSQL 17, TimescaleDB
#     2.28.x) — damit lässt sich ein Backup einer bestehenden Anlage 1:1
#     einspielen (docker/README.md → „Bestandsdaten übernehmen“).
#   * Der pg-Client im DVhub-Image ist Version 17 — pg_dump muss mindestens so
#     neu sein wie der Server. Bei einem Wechsel auf PostgreSQL 18 beides anheben.
#
# DVhub läuft im Host-Netz: Modbus-TCP zur Anlage, der DV-Modbus-Server (:1502)
# und mDNS-Discovery (Victron, Shelly) brauchen das echte LAN; im Bridge-Netz
# funktioniert Multicast nicht. Die DB ist nur auf 127.0.0.1 veröffentlicht.
#
# EOS (Pro-Optimierer) läuft als dritter Container im Profil „eos“ — in
# .env.example per COMPOSE_PROFILES=eos eingeschaltet (komplette Suite). Auf
# kleinen Boxen weglassen; DVhub plant dann mit der eigenen Börsenautomatik.
#
# NICHT enthalten: Python-Prognose/ML, VPN, Support-Tunnel.

name: dvhub

services:
  db:
    image: timescale/timescaledb:${TIMESCALE_TAG:-2.28.2-pg17}
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:?DB_ADMIN_PASSWORD in docker/.env setzen}
      # für die DB-Ersteinrichtung (configs: dvhub-db-init, unten)
      DVHUB_DB_PASSWORD: ${DVHUB_DB_PASSWORD:?DVHUB_DB_PASSWORD in docker/.env setzen}
      TZ: ${TZ:-Europe/Berlin}
      # timescaledb-tune bekommt ein festes Budget, statt es aus der cgroup zu
      # lesen — auf Hosts ohne cgroup-Memory (Raspberry Pi OS) stürzt die
      # Erkennung sonst mit „bytes must be at least 1 byte“ ab.
      TS_TUNE_MEMORY: ${DB_TUNE_MEMORY:-256MB}
    # shared_buffers explizit (wirkt auch auf bestehende Volumes, anders als das
    # einmalige timescaledb-tune). 64 MB reichen: DVhub liest über Continuous
    # Aggregates und die 15-min-Tabelle, der Rest ist freigebbarer Page-Cache.
    #
    # Speicherfresser fest begrenzen (2026-10-01): beim Restore der vollen
    # Prod-DB (6 GB) baute PostgreSQL Indizes mit 48 MB maintenance_work_mem ×
    # (1 + 2 Parallel-Worker) neben 64 MB shared_buffers → OOM-Kill bei 160 MB.
    # Ohne Parallel-Worker und mit 16 MB passt Restore und Dauerbetrieb.
    command: ["postgres",
              "-c", "shared_buffers=${DB_SHARED_BUFFERS:-64MB}",
              "-c", "maintenance_work_mem=${DB_MAINTENANCE_WORK_MEM:-16MB}",
              "-c", "max_parallel_maintenance_workers=0",
              "-c", "max_parallel_workers_per_gather=0",
              "-c", "work_mem=2MB",
              "-c", "autovacuum_max_workers=2",
              "-c", "timescaledb.max_background_workers=4",
              # Schreibarm (SD-Karte/eMMC, wie pg-write-tuning.sh nativ).
              "-c", "synchronous_commit=off",
              "-c", "wal_writer_delay=1s",
              "-c", "checkpoint_timeout=15min",
              "-c", "wal_compression=on"]
    volumes:
      - dvhub-db:/var/lib/postgresql/data
    # Erststart der DB (siehe configs unten) — steckt in dieser Datei, damit die
    # Installation nur compose.yml + .env braucht (Docker Compose ≥ 2.23).
    configs:
      - source: dvhub-db-init
        target: /docker-entrypoint-initdb.d/010-dvhub.sh
        mode: 0555
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    shm_size: 256m
    # Speicherbudget der Suite: die OBERGRENZEN aller drei Container ergeben
    # zusammen 704 MB (DB 160 + DVhub 192 + EOS 352). Page-Cache zählt mit,
    # wird bei Druck aber freigegeben.
    mem_limit: ${DB_MEM_LIMIT:-224m}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dvhub"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  dvhub:
    image: ${DVHUB_IMAGE:-docker.io/bikinibottomcapital/dvhub}:${DVHUB_TAG:-latest}
    # Zum lokalen Bauen statt Ziehen: docker compose ... up -d --build
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    network_mode: host
    depends_on:
      db:
        condition: service_healthy
    # VPN zum Direktvermarkter (OpenVPN/WireGuard) im DVhub-Container: Tunnel anlegen
    # braucht NET_ADMIN und das TUN-Gerät. Host-Netz → tun0 wie nativ.
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun:/dev/net/tun"]
    environment:
      TZ: ${TZ:-Europe/Berlin}
      DVHUB_HTTP_PORT: ${DVHUB_HTTP_PORT:-8080}
      # 1 = Lese-Modus: keine Schreibzugriffe auf Anlage, Wallbox, Relais
      # (Test-/Zweitinstanz mit kopierter Prod-Konfiguration).
      DVHUB_READ_ONLY: ${DVHUB_READ_ONLY:-}
      DVHUB_DB_HOST: 127.0.0.1
      DVHUB_DB_PORT: ${DB_PORT:-5433}
      DVHUB_DB_NAME: dvhub
      DVHUB_DB_USER: dvhub
      DVHUB_DB_PASSWORD: ${DVHUB_DB_PASSWORD}
      DVHUB_DB_TIMESCALEDB: "true"
      # Speicher-Limit der DB — DVhub wählt danach sein DB-Profil (db-tuning.js).
      DVHUB_DB_MEM_LIMIT: ${DB_MEM_LIMIT:-224m}
      # Nur für DB-Backup/-Restore aus der Oberfläche (Einstellungen → Status).
      DVHUB_DB_ADMIN_USER: postgres
      DVHUB_DB_ADMIN_PASSWORD: ${DB_ADMIN_PASSWORD}
      # EOS-Container (Profil eos). Einschalten in DVhub: Einstellungen → EOS.
      DVHUB_EOS_URL: http://127.0.0.1:${EOS_PORT:-8503}
    volumes:
      # Beide Pflicht: Config + Datenverzeichnis (appliance-id = Lizenzbindung,
      # Push-Schlüssel, Datenspende-Zugang, Sitzungsschlüssel …).
      - dvhub-config:/etc/dvhub
      - dvhub-data:/var/lib/dvhub
      # Optional: Ziel für das geplante DB-Backup (Einstellungen → DB-Backup →
      # Zielverzeichnis /backups), z. B. ein ins Host-OS gemounteter NAS-Share.
      # - /srv/dvhub-backups:/backups
    # Der Entrypoint leitet daraus den Node-Heap ab (70 % → ~134 MB). Gemessen:
    # Leerlauf ~50 MB, Parquet-Export 365 Tage ~136 MB.
    mem_limit: ${DVHUB_MEM_LIMIT:-192m}

  eos:
    # DV-EOS (Fork von Akkudoktor-EOS) im selben Stand wie auf den Appliances.
    # Gebaut aus dem Dockerfile des Forks am Git-Tag — kein zweites Rezept hier.
    image: ${EOS_IMAGE:-docker.io/bikinibottomcapital/dvhub-eos}:${EOS_TAG:-dvhub-v0.4.0rc1.13}
    build:
      context: ${EOS_REPO:-https://github.com/chloepriceless/DV-EOS.git}#${EOS_TAG:-dvhub-v0.4.0rc1.13}
    profiles: [eos]
    restart: unless-stopped
    # Host-Netz wie DVhub; EOS lauscht nur auf 127.0.0.1 (nicht im LAN).
    network_mode: host
    command: ["python", "-m", "akkudoktoreos.server.eos",
              "--host", "127.0.0.1", "--port", "${EOS_PORT:-8503}", "--run_as_user", "eos"]
    environment:
      TZ: ${TZ:-Europe/Berlin}
      # EOSdash aus: DVhub hat eine eigene Oberfläche, spart ~190 MB.
      EOS_SERVER__STARTUP_EOSDASH: "false"
      MALLOC_ARENA_MAX: "2"
      # Speicher eines Planungslaufs danach zurückgeben (eos-provision.sh nativ gleich).
      PYTHONMALLOC: malloc
      MALLOC_TRIM_THRESHOLD_: "131072"
      MALLOC_MMAP_THRESHOLD_: "131072"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      # Feste Zeitzone statt Nachschlagen (spart ~25 MB; EOS ab rc1.5).
      EOS_GENERAL__TIMEZONE_OVERRIDE: ${TZ:-Europe/Berlin}
    # Optionale anlagenspezifische EOS-Einstellungen (z. B. EOS_INVERTER_EFF_CURVE).
    env_file:
      - path: ./eos.env
        required: false
    volumes:
      - dvhub-eos:/data
    # Eigener Speicher frisch ~205 MB, nach Tagen Dauerbetrieb ~290 MB
    # (Appliance, 15-min-Optimierung); Spitze dort 352 MB inkl. Page-Cache.
    # rc1.8 mit 2 Rechenprozessen (eHive, 300×200): Spitze 224 MB, danach 128 MB
    # — die Prozesse teilen sich den Speicher per fork.
    mem_limit: ${EOS_MEM_LIMIT:-320m}
    # Kein CPU-Kontingent: EOS (ab rc1.10) rechnet mit höchstens 2 Prozessen,
    # lässt immer einen Kern frei (2 Kerne -> 1, ab 3 Kernen -> 2) und pinnt
    # sie auf die letzten Kerne. DVhub, PostgreSQL, weitere Container (z. B.
    # MQTT) und der EOS-Server selbst behalten die übrigen.
    # Niedrigere Gewichtung wie nativ (Nice=10/CPUWeight=20).
    cpus: ${EOS_CPUS:-0}
    cpu_shares: 256

# Erststart der DB (läuft nur bei leerem Datenverzeichnis, als postgres):
# App-Rolle + DB + TimescaleDB anlegen — wie install.sh/timescale-provision.sh
# auf der nativen Appliance. dvhub ist bewusst KEIN Superuser (der DB-Restore
# sperrt die App per CONNECTION LIMIT 0 aus; das wirkt nur auf Nicht-Superuser).
# $$ = ein wörtliches $ (Compose ersetzt sonst Variablen im Inhalt).
configs:
  dvhub-db-init:
    content: |
      #!/bin/sh
      set -eu
      : "$${DVHUB_DB_PASSWORD:?DVHUB_DB_PASSWORD fehlt}"
      psql -v ON_ERROR_STOP=1 --username postgres --dbname postgres -v pw="$$DVHUB_DB_PASSWORD" <<'SQL'
      SELECT format('CREATE ROLE dvhub LOGIN PASSWORD %L', :'pw')
      WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'dvhub') \gexec
      SELECT 'CREATE DATABASE dvhub OWNER dvhub'
      WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = 'dvhub') \gexec
      SQL
      psql -v ON_ERROR_STOP=1 --username postgres --dbname dvhub <<'SQL'
      CREATE EXTENSION IF NOT EXISTS timescaledb;
      SQL
      echo "[db-init] Rolle dvhub, DB dvhub und TimescaleDB angelegt"

volumes:
  dvhub-config:
  dvhub-data:
  dvhub-db:
  dvhub-eos:
